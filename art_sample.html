<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifold Novum Art</title>
<style>
  :root { --bg: #07090f; --fg: #9aa3b5; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  canvas { display: block; width: 100%; height: auto; border-radius: 6px; }
  p { margin: 10px 2px 0; }
</style>
</head>
<body>
<main>
  <canvas id="c"></canvas>
  <p>Manifold Novum — art style sample. Everything is drawn procedurally in canvas.</p>
</main>
<script>
// ---------------------------------------------------------------------------
// Setup
// ---------------------------------------------------------------------------
const W = 1280, H = 720, T = 48;            // logical size, tile size
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * DPR; canvas.height = H * DPR;
ctx.scale(DPR, DPR);

const OUT = '#14161b';                       // universal outline color
const C = {
  hull: '#4a5263', hullDark: '#3a414f', hullLight: '#5f6879',
  floorA: '#6c7282', floorB: '#686e7d', grout: '#555b69',
  beltBase: '#2a2d34', beltRail: '#d2a62e', beltChevron: '#43474f',
  rock: '#9a8a76', rockLight: '#b8a891', rockDark: '#6f6253',
  aster: '#6e6359', asterLight: '#8d8274', asterDark: '#4c433c',
  crate: '#a48c5c', crateDark: '#6e5a37', crateLight: '#c2aa76',
  suit: '#c4683a', suitDark: '#8e4724', skin: '#e6c19b', hair: '#3a2a21',
  glow: '#5fd6e4', window: '#5fa8c9',
};

function rng(seed) {                         // mulberry32
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function poly(pts) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
}

function stroke(w = 2.5, col = OUT) {
  ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
}

function shadowEllipse(x, y, rx, ry, a = 0.35) {
  ctx.fillStyle = `rgba(0,0,0,${a})`;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}

// ---------------------------------------------------------------------------
// Lumpy rocks: asteroids and the "rock" item share one shape language
// ---------------------------------------------------------------------------
function lumpShape(seed, n, jitter) {
  const r = rng(seed), pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (r() - 0.5) * 0.35;
    pts.push([Math.cos(a), Math.sin(a), 1 - jitter + r() * jitter * 1.3]);
  }
  const craters = [];
  for (let i = 0; i < 3; i++) craters.push([(r() - 0.5) * 0.9, (r() - 0.5) * 0.9, 0.12 + r() * 0.14]);
  return { pts, craters };
}

function drawLump(shape, x, y, rad, rot, pal, withCraters) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const pts = shape.pts.map(([cx, cy, m]) => [cx * rad * m, cy * rad * m]);
  // body with light from top-left
  poly(pts);
  const g = ctx.createRadialGradient(-rad * 0.4, -rad * 0.45, rad * 0.1, 0, 0, rad * 1.1);
  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, pal[2]);
  ctx.fillStyle = g; ctx.fill();
  if (withCraters) {
    ctx.save(); poly(pts); ctx.clip();
    for (const [cx, cy, cr] of shape.craters) {
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.ellipse(cx * rad, cy * rad, cr * rad, cr * rad * 0.85, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(cx * rad + 1, cy * rad + 1, cr * rad, cr * rad * 0.85, 0, 0.2, 2.2); ctx.stroke();
    }
    ctx.restore();
  }
  poly(pts); stroke(withCraters ? 3 : 2);
  ctx.restore();
}

const ROCK_SHAPES = [101, 202, 303, 404, 505].map(s => lumpShape(s, 7, 0.35));
function drawRockItem(x, y, k = 0) {
  shadowEllipse(x + 2, y + 4, T * 0.22, T * 0.12, 0.35);
  drawLump(ROCK_SHAPES[k % ROCK_SHAPES.length], x, y, T * 0.24, k * 1.7,
           [C.rockLight, C.rock, C.rockDark], false);
}

// ---------------------------------------------------------------------------
// Space background
// ---------------------------------------------------------------------------
const STAR_LAYERS = [
  { n: 140, speed: 8,  size: [0.6, 1.1], alpha: 0.45 },
  { n: 70,  speed: 22, size: [1.0, 1.6], alpha: 0.7 },
  { n: 25,  speed: 55, size: [1.4, 2.2], alpha: 0.95 },
].map((L, li) => {
  const r = rng(900 + li);
  L.stars = Array.from({ length: L.n }, () => ({
    x: r() * W, y: r() * H, s: L.size[0] + r() * (L.size[1] - L.size[0]),
    tint: r() < 0.15 ? '#ffd9a8' : r() < 0.3 ? '#a8c8ff' : '#ffffff', tw: r() * 6,
  }));
  return L;
});

function drawSpace(t) {
  ctx.fillStyle = '#080b14'; ctx.fillRect(0, 0, W, H);
  // faint nebula clouds drifting slowly
  const neb = [[0.78, 0.25, 420, 'rgba(90,60,140,0.16)'], [0.15, 0.85, 380, 'rgba(40,90,120,0.14)'],
               [0.55, 0.95, 300, 'rgba(140,70,60,0.08)']];
  for (const [fx, fy, r, col] of neb) {
    const x = ((fx * W - t * 3) % (W + 800) + W + 800) % (W + 800) - 400;
    const g = ctx.createRadialGradient(x, fy * H, 0, x, fy * H, r);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  for (const L of STAR_LAYERS) {
    for (const s of L.stars) {
      const x = ((s.x - t * L.speed) % W + W) % W;
      ctx.globalAlpha = L.alpha * (0.75 + 0.25 * Math.sin(t * 2 + s.tw));
      ctx.fillStyle = s.tint;
      ctx.fillRect(x, s.y, s.s, s.s);
    }
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// Ship (grid 12x9 tiles plus a nose), stationary on screen; space scrolls past
// ---------------------------------------------------------------------------
const SX = 250, SY = 150;                   // ship origin on screen
const FLOOR = { x0: 1, y0: 1, x1: 11, y1: 8 }; // interior tiles [x0,x1) x [y0,y1)
const tx = x => SX + x * T, ty = y => SY + y * T;

const HULL = [[0, 0.5], [0.5, 0], [12, 0], [14.4, 3.7], [14.4, 5.3], [12, 9], [0.5, 9], [0, 8.5]]
  .map(([x, y]) => [tx(x), ty(y)]);

function drawEngines(t) {
  for (const ey of [2.2, 6.8]) {
    const x = tx(0), y = ty(ey);
    // flame
    const flick = 1 + 0.12 * Math.sin(t * 31 + ey) + 0.08 * Math.sin(t * 17);
    const len = T * 1.9 * flick;
    const g = ctx.createRadialGradient(x - T * 0.3, y, 2, x - T * 0.3, y, len);
    g.addColorStop(0, 'rgba(255,240,200,0.95)'); g.addColorStop(0.25, 'rgba(255,170,70,0.75)');
    g.addColorStop(0.6, 'rgba(230,80,40,0.25)'); g.addColorStop(1, 'rgba(200,40,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(x - len * 0.45, y, len * 0.6, T * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    // nozzle
    poly([[x + 4, y - T * 0.55], [x - T * 0.45, y - T * 0.42], [x - T * 0.45, y + T * 0.42], [x + 4, y + T * 0.55]]);
    ctx.fillStyle = C.hullDark; ctx.fill(); stroke(2.5);
    ctx.fillStyle = '#2a2e37'; ctx.fillRect(x - T * 0.45, y - T * 0.32, 5, T * 0.64);
  }
}

function drawHull() {
  // drop shadow onto space
  ctx.save(); ctx.translate(8, 10); poly(HULL); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill(); ctx.restore();
  poly(HULL);
  const g = ctx.createLinearGradient(0, ty(0), 0, ty(9));
  g.addColorStop(0, C.hullLight); g.addColorStop(0.5, C.hull); g.addColorStop(1, C.hullDark);
  ctx.fillStyle = g; ctx.fill();
  // panel seams on the wall band
  ctx.save(); poly(HULL); ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1.5;
  for (let x = 1; x < 12; x += 2) {
    ctx.beginPath(); ctx.moveTo(tx(x), ty(0)); ctx.lineTo(tx(x), ty(1));
    ctx.moveTo(tx(x), ty(8)); ctx.lineTo(tx(x), ty(9)); ctx.stroke();
  }
  // hazard stripe along the nose
  ctx.translate(tx(12.6), ty(0));
  ctx.fillStyle = '#c99a2c';
  ctx.fillRect(0, 0, T * 0.35, T * 9);
  ctx.fillStyle = '#2b2b2b';
  for (let i = -2; i < 22; i++) {
    poly([[0, i * T * 0.45], [T * 0.35, i * T * 0.45 + T * 0.25], [T * 0.35, i * T * 0.45 + T * 0.45], [0, i * T * 0.45 + T * 0.2]]);
    ctx.fill();
  }
  ctx.restore();
  // cockpit window
  const win = [[12.0, 3.0], [13.6, 3.9], [13.6, 5.1], [12.0, 6.0]].map(([x, y]) => [tx(x), ty(y)]);
  poly(win);
  const wg = ctx.createLinearGradient(tx(12), ty(3), tx(13.6), ty(6));
  wg.addColorStop(0, '#9fd6ec'); wg.addColorStop(0.4, C.window); wg.addColorStop(1, '#244a63');
  ctx.fillStyle = wg; ctx.fill(); stroke(3);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(tx(12.3), ty(3.5)); ctx.lineTo(tx(13.0), ty(3.9)); ctx.stroke();
  poly(HULL); stroke(3.5);
}

function drawFloor() {
  for (let y = FLOOR.y0; y < FLOOR.y1; y++) for (let x = FLOOR.x0; x < FLOOR.x1; x++) {
    ctx.fillStyle = (x + y) % 2 ? C.floorA : C.floorB;
    ctx.fillRect(tx(x), ty(y), T, T);
    ctx.strokeStyle = C.grout; ctx.lineWidth = 1;
    ctx.strokeRect(tx(x) + 0.5, ty(y) + 0.5, T - 1, T - 1);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (const [rx, ry] of [[5, 5], [T - 7, 5], [5, T - 7], [T - 7, T - 7]]) ctx.fillRect(tx(x) + rx, ty(y) + ry, 2, 2);
  }
  // inner shadow cast by walls
  const x0 = tx(FLOOR.x0), y0 = ty(FLOOR.y0), x1 = tx(FLOOR.x1), y1 = ty(FLOOR.y1);
  let g = ctx.createLinearGradient(0, y0, 0, y0 + 18);
  g.addColorStop(0, 'rgba(0,0,0,0.4)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x0, y0, x1 - x0, 18);
  g = ctx.createLinearGradient(x0, 0, x0 + 12, 0);
  g.addColorStop(0, 'rgba(0,0,0,0.3)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x0, y0, 12, y1 - y0);
  // wall lip
  ctx.strokeStyle = C.hullLight; ctx.lineWidth = 2;
  ctx.strokeRect(x0 - 1, y0 - 1, x1 - x0 + 2, y1 - y0 + 2);
  ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
}

// ---------------------------------------------------------------------------
// Belts: one item per tile. Canonical straight = moving east,
// canonical corner = enter moving east, exit moving north (pivot at top-left).
// ---------------------------------------------------------------------------
const DIRS = { E: 0, S: Math.PI / 2, W: Math.PI, N: -Math.PI / 2 };
const BELTS = [
  ...[3, 4, 5, 6, 7, 8].map(x => ({ x, y: 6, d: 'E' })),
  { x: 9, y: 6, d: 'N', from: 'E' },
  ...[5, 4, 3, 2, 1].map(y => ({ x: 9, y, d: 'N' })),
];

function beltTile(b, t) {
  const cx = tx(b.x) + T / 2, cy = ty(b.y) + T / 2;
  ctx.save(); ctx.translate(cx, cy);
  const corner = b.from && b.from !== b.d;
  // rotate so the canonical case lines up; corner rotation is based on its entry direction
  ctx.rotate(DIRS[corner ? b.from : b.d]);
  ctx.translate(-T / 2, -T / 2);
  const phase = (t * 1.6) % 1;              // chevron scroll
  if (!corner) {
    ctx.fillStyle = C.beltBase; ctx.fillRect(0, T * 0.1, T, T * 0.8);
    ctx.save(); ctx.beginPath(); ctx.rect(0, T * 0.14, T, T * 0.72); ctx.clip();
    ctx.strokeStyle = C.beltChevron; ctx.lineWidth = 4;
    for (let i = -1; i < 2; i++) {
      const x = (i + phase) * T / 2 + T * 0.1;
      ctx.beginPath(); ctx.moveTo(x, T * 0.25); ctx.lineTo(x + T * 0.16, T / 2); ctx.lineTo(x, T * 0.75); ctx.stroke();
    }
    ctx.restore();
    for (const ry of [0.1, 0.9]) {
      ctx.fillStyle = C.beltRail; ctx.fillRect(0, T * ry - 3, T, 6);
      ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.strokeRect(0, T * ry - 3, T, 6);
    }
  } else {
    // pivot at local top-left; band between radii 0.1T and 0.9T over a quarter turn
    ctx.beginPath(); ctx.arc(0, 0, T * 0.9, 0, Math.PI / 2); ctx.arc(0, 0, T * 0.1, Math.PI / 2, 0, true); ctx.closePath();
    ctx.fillStyle = C.beltBase; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.strokeStyle = C.beltChevron; ctx.lineWidth = 4;
    for (let i = -1; i < 3; i++) {
      // chevrons travel from angle PI/2 (left edge) toward 0 (top edge)
      const a = Math.PI / 2 - ((i + phase) / 3) * (Math.PI / 2);
      ctx.save(); ctx.rotate(a); ctx.translate(T / 2, 0); ctx.rotate(-Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(-T * 0.08, -T * 0.25); ctx.lineTo(T * 0.08, 0); ctx.lineTo(-T * 0.08, T * 0.25); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    for (const r of [0.1, 0.9]) {
      ctx.beginPath(); ctx.arc(0, 0, T * r, 0, Math.PI / 2);
      ctx.strokeStyle = OUT; ctx.lineWidth = 8.5; ctx.stroke();
      ctx.strokeStyle = C.beltRail; ctx.lineWidth = 5.5; ctx.stroke();
    }
  }
  ctx.restore();
}

// path of tile centers from chest to gun, for items riding the belt
const PATH = [[2, 6], ...BELTS.map(b => [b.x, b.y]), [9, 0]].map(([x, y]) => [tx(x) + T / 2, ty(y) + T / 2]);
function pathPoint(p) {
  const i = Math.floor(p), f = p - i;
  const a = PATH[Math.min(i, PATH.length - 1)], b = PATH[Math.min(i + 1, PATH.length - 1)];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
}

function drawBeltItems(t) {
  const len = PATH.length - 1, speed = 1.1, gap = 2;
  for (let k = 0; k < 8; k++) {
    const p = ((t * speed + k * gap) % (len + 2)) - 1;  // -1..len+1, hidden inside chest/gun
    if (p < 0.55 || p > len - 0.5) continue;
    const [x, y] = pathPoint(p);
    drawRockItem(x, y, k);
  }
}

// ---------------------------------------------------------------------------
// Props
// ---------------------------------------------------------------------------
function drawChest(t) {
  const x = tx(2) + 4, y = ty(6) + 6, w = T - 8, h = T - 10;
  shadowEllipse(x + w / 2 + 3, y + h - 1, w * 0.55, 7);
  roundRect(x, y, w, h, 5); ctx.fillStyle = C.crate; ctx.fill(); stroke(2.5);
  roundRect(x + 3, y + 3, w - 6, h * 0.36, 3); ctx.fillStyle = C.crateLight; ctx.fill();
  ctx.fillStyle = C.crateDark;
  ctx.fillRect(x + w * 0.2, y, 5, h); ctx.fillRect(x + w * 0.8 - 5, y, 5, h);
  ctx.fillStyle = '#d8c48a'; ctx.fillRect(x + w / 2 - 4, y + h * 0.42, 8, 6);
  ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.strokeRect(x + w / 2 - 4, y + h * 0.42, 8, 6);
  // "rock arrives" pop: a rock bobs out of the lid and a ring expands
  const k = (t % 2.6) / 2.6;
  if (k < 0.35) {
    const e = k / 0.35;
    ctx.strokeStyle = `rgba(255,230,160,${0.8 * (1 - e)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 10 + e * 26, 0, Math.PI * 2); ctx.stroke();
    drawRockItem(x + w / 2, y - 6 - Math.sin(e * Math.PI) * 16, 3);
  }
}

function drawReactor(t) {
  const cx = tx(2) + T, cy = ty(2) + T;
  shadowEllipse(cx + 4, cy + 8, T * 0.85, T * 0.6);
  poly(Array.from({ length: 8 }, (_, i) => {
    const a = i / 8 * Math.PI * 2 + Math.PI / 8;
    return [cx + Math.cos(a) * T * 0.9, cy + Math.sin(a) * T * 0.9];
  }));
  ctx.fillStyle = '#3f4655'; ctx.fill(); stroke(3);
  ctx.beginPath(); ctx.arc(cx, cy, T * 0.6, 0, Math.PI * 2);
  ctx.fillStyle = '#2b303a'; ctx.fill(); stroke(2);
  const pulse = 0.75 + 0.25 * Math.sin(t * 3);
  const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, T * 0.5);
  g.addColorStop(0, '#e9fdff'); g.addColorStop(0.35, C.glow); g.addColorStop(1, 'rgba(40,140,170,0)');
  ctx.globalAlpha = pulse; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, T * 0.5, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  for (let i = 0; i < 4; i++) {           // coolant pipes
    const a = i * Math.PI / 2 + Math.PI / 4;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * T * 0.75, cy + Math.sin(a) * T * 0.75, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#8a93a5'; ctx.fill(); stroke(1.5);
  }
}

function drawConsole(t) {
  const x = tx(10) + 6, y = ty(3) + 4, w = T - 12, h = T * 3 - 8;
  shadowEllipse(x + w / 2 + 3, y + h / 2 + 4, w * 0.7, h * 0.52, 0.3);
  roundRect(x, y, w, h, 6); ctx.fillStyle = '#3b4250'; ctx.fill(); stroke(2.5);
  for (let i = 0; i < 3; i++) {
    const sy = y + 8 + i * (h - 8) / 3;
    roundRect(x + 6, sy, w - 12, (h - 8) / 3 - 8, 3);
    ctx.fillStyle = i === 1 ? '#2f8f6f' : '#2d5d7a'; ctx.fill(); stroke(1.5);
    ctx.fillStyle = 'rgba(200,255,240,0.7)';
    for (let j = 0; j < 3; j++) {
      const bw = (w - 20) * (0.3 + 0.6 * Math.abs(Math.sin(t * 1.3 + i * 2 + j)));
      ctx.fillRect(x + 10, sy + 6 + j * 8, bw, 3);
    }
  }
}

function drawCrew(x, y, t, facing) {
  const bob = Math.sin(t * 6) * 1.2;
  shadowEllipse(x, y + T * 0.3, T * 0.28, T * 0.1, 0.4);
  // body
  ctx.beginPath(); ctx.ellipse(x, y + T * 0.08 + bob * 0.3, T * 0.27, T * 0.25, 0, 0, Math.PI * 2);
  ctx.fillStyle = C.suit; ctx.fill(); stroke(2.5);
  ctx.beginPath(); ctx.ellipse(x, y + T * 0.16 + bob * 0.3, T * 0.2, T * 0.12, 0, 0, Math.PI);
  ctx.fillStyle = C.suitDark; ctx.fill();
  ctx.fillStyle = '#e9d27a'; ctx.fillRect(x - T * 0.03, y + T * 0.0 + bob * 0.3, T * 0.06, T * 0.14); // zipper stripe
  // head
  const hy = y - T * 0.2 + bob;
  ctx.beginPath(); ctx.arc(x, hy, T * 0.19, 0, Math.PI * 2);
  ctx.fillStyle = C.skin; ctx.fill(); stroke(2.5);
  // hair cap, offset to show facing
  ctx.beginPath(); ctx.arc(x - facing * 2, hy - 3, T * 0.17, Math.PI * 0.95, Math.PI * 2.05);
  ctx.fillStyle = C.hair; ctx.fill();
  ctx.fillStyle = OUT;
  ctx.beginPath(); ctx.arc(x + facing * 4 - 3, hy + 2, 1.6, 0, Math.PI * 2); ctx.arc(x + facing * 4 + 4, hy + 2, 1.6, 0, Math.PI * 2); ctx.fill();
}

// ---------------------------------------------------------------------------
// Gun turret on the top wall, fed by the belt ending at (9,1)
// ---------------------------------------------------------------------------
const GUN = { x: tx(9) + T / 2, y: ty(0) + T * 0.45 };
let gunAngle = -Math.PI / 4, ammo = 4;

function drawGun(t, flash) {
  const { x, y } = GUN;
  shadowEllipse(x + 4, y + 6, T * 0.55, T * 0.45, 0.4);
  poly(Array.from({ length: 8 }, (_, i) => {
    const a = i / 8 * Math.PI * 2 + Math.PI / 8;
    return [x + Math.cos(a) * T * 0.56, y + Math.sin(a) * T * 0.56];
  }));
  ctx.fillStyle = '#383e4b'; ctx.fill(); stroke(3);
  ctx.save(); ctx.translate(x, y); ctx.rotate(gunAngle);
  const recoil = flash * 6;
  // barrel
  roundRect(T * 0.1 - recoil, -T * 0.09, T * 0.85, T * 0.18, 3);
  ctx.fillStyle = '#2e333d'; ctx.fill(); stroke(2.5);
  ctx.fillStyle = '#596274'; ctx.fillRect(T * 0.75 - recoil, -T * 0.11, T * 0.12, T * 0.22);
  // head
  roundRect(-T * 0.32 - recoil * 0.5, -T * 0.28, T * 0.58, T * 0.56, 9);
  ctx.fillStyle = '#7b8597'; ctx.fill(); stroke(2.5);
  ctx.fillStyle = '#c99a2c'; ctx.fillRect(-T * 0.22 - recoil * 0.5, -T * 0.28, T * 0.08, T * 0.56);
  if (flash > 0) {
    ctx.globalAlpha = flash;
    const g = ctx.createRadialGradient(T * 1.05, 0, 0, T * 1.05, 0, T * 0.45);
    g.addColorStop(0, '#fff6d0'); g.addColorStop(0.4, 'rgba(255,190,80,0.8)'); g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(T * 1.05, 0, T * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // ammo pips (capacity 5) on the wall to the left of the turret
  for (let i = 0; i < 5; i++) {
    const px = tx(7) + 8 + i * 13, py = ty(0) + T * 0.5 - 5;
    roundRect(px, py, 10, 10, 2);
    ctx.fillStyle = i < ammo ? C.rockLight : '#2a2e37'; ctx.fill(); stroke(1.5);
  }
}

// ---------------------------------------------------------------------------
// Asteroids drifting past (ship flies right, so they scroll left)
// ---------------------------------------------------------------------------
const ASTEROIDS = [
  [1200, 70, 46, 0.25], [980, 560, 30, 0.4], [1110, 640, 62, 0.15], [60, 80, 24, 0.5],
  [700, 40, 18, 0.6], [1240, 330, 22, 0.55], [90, 660, 40, 0.3], [420, 650, 16, 0.7],
].map(([x, y, r, s], i) => ({ x, y, r, spin: s * (i % 2 ? 1 : -1), shape: lumpShape(77 + i * 13, 12, 0.3), hit: 0 }));

function asteroidPos(a, t) {
  const speed = 26 + 40 / a.r * 8;          // smaller ones move faster for parallax-ish variety
  const span = W + 200;
  return [((a.x - t * speed) % span + span) % span - 100, a.y + Math.sin(t * 0.3 + a.r) * 6];
}

function drawAsteroids(t) {
  for (const a of ASTEROIDS) {
    const [x, y] = asteroidPos(a, t);
    shadowEllipse(x + 6, y + 8, a.r * 0.95, a.r * 0.8, 0.25);
    drawLump(a.shape, x, y, a.r, t * a.spin, [C.asterLight, C.aster, C.asterDark], true);
    if (a.hit > 0) {
      ctx.save(); ctx.globalAlpha = a.hit * 0.6; ctx.globalCompositeOperation = 'lighter';
      drawLump(a.shape, x, y, a.r, t * a.spin, ['#ffd9a0', '#c08050', '#603020'], false);
      ctx.restore();
    }
  }
}

// ---------------------------------------------------------------------------
// Shots and debris
// ---------------------------------------------------------------------------
const shots = [], debris = [];
let nextShot = 0.6, flash = 0;

function updateCombat(t, dt) {
  // aim at nearest asteroid above/right of the ship
  let best = null, bd = Infinity;
  for (const a of ASTEROIDS) {
    const [x, y] = asteroidPos(a, t);
    if (y > GUN.y + 40 || x < GUN.x - 300) continue;
    const d = Math.hypot(x - GUN.x, y - GUN.y);
    if (d < bd && d < 520) { bd = d; best = a; }
  }
  if (best) {
    const [x, y] = asteroidPos(best, t);
    const want = Math.atan2(y - GUN.y, x - GUN.x);
    let diff = ((want - gunAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    gunAngle += diff * Math.min(1, dt * 6);
    if (t > nextShot && Math.abs(diff) < 0.1) {
      nextShot = t + 1.3; flash = 1;
      ammo = ammo > 1 ? ammo - 1 : 5;        // sample only: cycles the pip display
      shots.push({ x: GUN.x + Math.cos(gunAngle) * T, y: GUN.y + Math.sin(gunAngle) * T, a: best, life: 0 });
    }
  }
  flash = Math.max(0, flash - dt * 6);
  for (const s of shots) {
    const [x, y] = asteroidPos(s.a, t);
    const d = Math.hypot(x - s.x, y - s.y);
    const step = 900 * dt;
    s.px = s.x; s.py = s.y;
    if (d <= s.a.r || d < step) {
      s.dead = true; s.a.hit = 1;
      const r = rng(Math.floor(t * 1000));
      for (let i = 0; i < 10; i++) {
        const ang = Math.atan2(s.y - y, s.x - x) + (r() - 0.5) * 2.2, sp = 60 + r() * 160;
        debris.push({ x: s.x, y: s.y, vx: Math.cos(ang) * sp - 30, vy: Math.sin(ang) * sp, life: 0.6 + r() * 0.5, s: 2 + r() * 3 });
      }
    } else { s.x += (x - s.x) / d * step; s.y += (y - s.y) / d * step; }
  }
  for (let i = shots.length - 1; i >= 0; i--) if (shots[i].dead) shots.splice(i, 1);
  for (const d of debris) { d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt; }
  for (let i = debris.length - 1; i >= 0; i--) if (debris[i].life <= 0) debris.splice(i, 1);
  for (const a of ASTEROIDS) a.hit = Math.max(0, a.hit - dt * 4);
}

function drawCombat() {
  for (const s of shots) {
    ctx.strokeStyle = 'rgba(255,210,140,0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(s.px ?? s.x, s.py ?? s.y); ctx.lineTo(s.x - (s.x - (s.px ?? s.x)) * 3, s.y - (s.y - (s.py ?? s.y)) * 3); ctx.stroke();
    ctx.fillStyle = C.rockLight; ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill(); stroke(1.5);
  }
  for (const d of debris) {
    ctx.globalAlpha = Math.min(1, d.life * 2);
    ctx.fillStyle = C.asterLight; ctx.fillRect(d.x, d.y, d.s, d.s);
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// Frame
// ---------------------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  updateCombat(t, dt);
  drawSpace(t);
  drawAsteroids(t);
  drawEngines(t);
  drawHull();
  drawFloor();
  drawReactor(t);
  drawConsole(t);
  for (const b of BELTS) beltTile(b, t);
  drawChest(t);
  drawBeltItems(t);
  const wx = tx(5.5) + Math.sin(t * 0.5) * T * 1.2;  // crew member pacing
  drawCrew(wx, ty(3.5), t, Math.cos(t * 0.5) > 0 ? 1 : -1);
  drawGun(t, flash);
  drawCombat();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
