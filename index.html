  /* --- the metal kit (assets/ui, tools/blender/models/ui/ui.py) ----------------------------------------
     html.metal-gl: js/menugl.js draws the lit metal on a canvas under each layer, so the DOM's own
     backgrounds go; html.metal-css (no WebGL2, ?classic, file://, or while loading): the same baked
     textures as border-images. Layout is the same in both. Spacing on an 8 px grid; the plates' frame is
     28 px (+ 18 px of air inside it), insets have a 16 px rim. Buttons are silver; START is the one red. */
  .metal-layer { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; cursor: default; }

  .plate::before, .plate::after { display: none; }

  .paints { gap: 10px; } .paint { width: 30px; height: 30px; }

  /* silver buttons: dark, embossed labels; the red START keeps white. Disabled / not yours to pick:
     the metal is dimmed (menugl.js) and the label greyed, but no see-through opacity */
  :is(#lobby, #shop) :is(button:disabled:not(#lobby-start), #room.guest .mission:not(.chosen), .mission.locked) { opacity: 1 !important; color: #2c3038 !important; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) !important; }

    color: #161a21; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4); }

  :is(#lobby, #shop) .mission em { color: #8a5600; } :is(#lobby, #shop) .mission em.done { color: #17663f; }

  /* CSS look */
  html.metal-css :is(#lobby, #shop) .plate { border: 3px solid transparent; box-shadow: 0 16px 44px rgba(0,0,0,0.6);
    background: #5d6880 url(assets/ui/plate_fill.png) 25px 25px / 256px 256px;   /* (size per plate: sizePanelsCss() in js/menugl.js) */
    background-clip: padding-box; border-image: url(assets/ui/plate.png) 56 / 28px / 0 stretch; }
  html.metal-css :is(#lobby, #shop) :is(.row button, #lobby-start, #shop-close, .mission, .item, #room-back, button.join) {
    background: none; border-color: transparent; border-image-source: var(--up); border-image-slice: 32 fill; border-image-width: 16px; }

  html.metal-css #lobby-start { border-image-repeat: round; }
  html.metal-css :is(#lobby, #shop) :is(.mission.chosen, .item.chosen) { border-image-source: var(--dn); box-shadow: none; }
  html.metal-css :is(#lobby, #shop) :is(.row button, #lobby-start, #shop-close, .mission, .item, #room-back, button.join):hover:not(:disabled) {
    background: none; filter: brightness(1.15) drop-shadow(0 0 8px rgba(255, 236, 200, 0.3)); }
  html.metal-css #lobby-start:hover:not(:disabled) { filter: brightness(1.08) drop-shadow(0 0 8px rgba(255, 236, 200, 0.22)); }
  html.metal-css :is(#lobby, #shop) :is(.row button, #lobby-start, #shop-close, .mission, .item, #room-back, button.join):active:not(:disabled) {
    border-image-source: var(--dn); filter: brightness(0.92); }
  html.metal-css :is(#lobby, #shop) :is(#menu-games, #lobby-brief, #lobby-missions) { background: none; border-color: transparent;
    border-image: url(assets/ui/inset.png) 32 fill / 16px stretch; }
  html.metal-css #lobby input { background: none; border-color: transparent; border-image: url(assets/ui/inset.png) 32 fill / 9px stretch; }
  html.metal-css #lobby-profile .bar { background: none; border-color: transparent; border-image: url(assets/ui/inset.png) 32 fill / 5px stretch; }
  html.metal-css .paint { border: none; background-image: url(assets/ui/swatch.png) !important; background-size: 100% 100% !important; background-blend-mode: multiply; }
  html.metal-css .paint.chosen { background-image: url(assets/ui/swatch_down.png) !important; box-shadow: 0 0 0 2px #fff, 0 0 10px rgba(255,255,255,0.5); }
  html.metal-css :is(.mission, #shop .item)::after { content: ''; position: absolute; right: 15px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
    background: url(assets/ui/led_off.png) center / 100% 100%; }
  html.metal-css :is(.mission.chosen, #shop .item.chosen)::after { background-image: url(assets/ui/led_on.png); filter: drop-shadow(0 0 4px rgba(95, 214, 160, 0.8)); }
  html.metal-css :is(#lobby, #shop) :is(.row button, #lobby-start, .item):disabled { opacity: 1; filter: brightness(0.6) saturate(0.5); }
  html.metal-css :is(#menu-you, #menu-play, #room .plate)::before { display: block; content: ''; position: absolute; pointer-events: none;
    inset: auto auto 2px calc(50% - 41.5px); width: 83px; height: 18px; background: center / 100% 100% no-repeat; }
  html.metal-css #menu-you::before { background-image: url(assets/ui/tag_crew.png); }
  html.metal-css #menu-play::before { background-image: url(assets/ui/tag_ops.png); }
  html.metal-css #room .plate::before { background-image: url(assets/ui/tag_brief.png); }
  html.metal-css :is(#menu-you, #room .plate)::after { display: block; content: ''; position: absolute; pointer-events: none; width: 124.8px; height: 102.4px;
    background: url(assets/ui/tape.png) center / 100% 100% no-repeat; }
  html.metal-css #menu-you::after { right: -31.4px; top: -24.2px; }
  html.metal-css #room .plate::after { left: -25.4px; bottom: -20.2px; }
  /* lit look: the canvas draws all of it */
  html.metal-gl :is(#lobby, #shop) .plate { background: none; border-color: transparent; box-shadow: 0 16px 44px rgba(0,0,0,0.55); }
  html.metal-gl :is(#lobby, #shop) :is(button, input, #menu-games, #lobby-brief, #lobby-missions, .bar) {
    background: transparent !important; border-color: transparent !important; box-shadow: none !important; filter: none !important; }
  html.metal-gl .paint.chosen { box-shadow: 0 0 0 2px rgba(255,255,255,0.85), 0 0 8px rgba(255,255,255,0.4) !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lobby">
  <div id="menu" class="screen">
    <header class="title">
      <h1>MANIFOLD NOVUM</h1>
      <p class="sub">Jump in, keep the duct tape coming, jump out.</p>
    </header>
    <div class="menu-cols">
      <section class="plate" id="menu-you">
        <h2>YOUR CREW MEMBER</h2>
        <label for="lobby-name">NAME</label>
        <input id="lobby-name" maxlength="20" autocomplete="off" spellcheck="false">
        <div id="lobby-profile"></div>
        <label>SUIT COLOR</label>
        <div id="lobby-paint" class="paints"></div>
        <div class="row"><button id="lobby-locker">LOCKER <small>gear</small></button><button id="lobby-shipyard">SHIPYARD <small>upgrades</small></button><button id="lobby-music" onclick="window.open('music.html', '_blank')">♪ MUSIC</button></div>
      </section>
      <section class="plate" id="menu-play">
        <h2>PLAY</h2>
        <div class="row big"><button id="menu-solo">PLAY SOLO</button><button id="menu-open" disabled>OPEN A GAME</button></div>
        <div class="list-head"><label>OPEN GAMES</label><span id="menu-net" class="net none">offline</span></div>
        <ul id="menu-games"></ul>
        <div id="menu-msg" role="status"></div>
      </section>
    </div>
  </div>
  <div id="room" class="screen" hidden>
    <div class="plate">
      <div class="room-head">
        <button id="room-back">‹ MENU</button>
        <div><h1 id="room-title">SOLO MISSION</h1><p id="room-host" class="sub"></p></div>
      </div>
      <div class="room-cols">
        <div>
          <label>MISSION</label>
          <div id="lobby-missions"></div>
        </div>
        <div class="room-side">
          <div id="lobby-brief"></div>
          <div class="list-head"><label>CREW</label><span id="room-count"></span></div>
          <ul id="lobby-players"><li>just you</li></ul>
          <div class="row"><button id="room-locker">LOCKER <small>gear</small></button><button id="room-shipyard">SHIPYARD <small>upgrades</small></button></div>
          <button id="lobby-start">START MISSION</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="shop" hidden>
  <div class="plate">
    <h1 id="shop-title" style="font-size:20px">LOCKER</h1>
    <div id="shop-body"></div>
    <button id="shop-close">DONE</button>
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>

<script src="js/minigames.js"></script>
<script src="js/organic.js"></script>
<script src="js/dock.js"></script>
