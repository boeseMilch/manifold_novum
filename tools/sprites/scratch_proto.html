<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor Scratches</title>
<!--
Prototype (not in the game): procedural floor scratches, computed per pixel in the fragment shader
from the floor cell's place on the ship grid (hash -> a set of scratches), over the real clean floor
tile from the sprite atlas (assets/sprites/interior/page0*). No textures for the scratches: every
1 x 1 plate cell gets its own set, at full screen resolution (the atlas normal maps are half-res).

  fine hairlines   normal only: a V-groove, box-filtered over the pixel footprint (so a 0.4-px
                   scratch is a faint light/dark dipole, not aliasing), plus an anisotropic glint:
                   a groove reflects a light when the half vector is perpendicular to it, so
                   scratches light up and go dark as a light moves
  scuff clusters   3-7 parallel lines (a dragged crate's corner)
  swirls           concentric arcs (a chair turning)
  deep gouges      wider and deeper: bare metal in the groove, a dark burr/grime rim
  drags            long lines that cross the seams (evaluated from the 3 x 3 neighbouring cells)
Wear: more of everything near the doorway / console markers (in the game: a per-tile wear value).

Serve with `node server.js 8079` and open http://localhost:8079/tools/sprites/scratch_proto.html
URL params (for screenshots): ppu, cx, cy (view centre, units), lx, ly, lz (light), orbit=0|1,
mode=new|old|split, view=lit|normals|scratch, fine, gouge, nrm, glint, tape.
Columns of tiles: x < 6 red zone (port), < 10 white, the rest blue (starboard), like the ship's zones.
-->
<style>
  :root { --bg: #101216; --panel: #1b1e24; --fg: #d6dae2; --dim: #8a909c; --acc: #e0a040; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #101216; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #ui { position: fixed; top: 8px; left: 8px; background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 8px 10px; border-radius: 6px; width: 250px; }
  #ui.hide > :not(.head) { display: none; }
  #ui label { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 3px 0; }
  #ui input[type=range] { width: 120px; }
  #ui .head { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  #ui .head button { background: none; border: 0; color: var(--dim); cursor: pointer; }
  #ui select { background: var(--bg); color: var(--fg); border: 1px solid #333; }
  #ui small { color: var(--dim); display: block; margin-top: 6px; line-height: 1.35; }
  #ms { color: var(--acc); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="head"><span>Floor scratches <span id="ms"></span></span><button id="hide">hide</button></div>
  <label>Compare <select id="mode"><option value="new">new (procedural)</option><option value="old">old (baked scuffs)</option><option value="split">split: old above, new below</option></select></label>
  <label>View <select id="view"><option value="lit">lit</option><option value="normals">normals only</option><option value="scratch">scratch layer only</option></select></label>
  <label>Zoom (px/unit) <input id="ppu" type="range" min="32" max="480" step="1"></label>
  <label>Fine scratches <input id="fine" type="range" min="0" max="3" step="0.05"></label>
  <label>Deep gouges <input id="gouge" type="range" min="0" max="1" step="0.01"></label>
  <label>Tape (per tile) <input id="tape" type="range" min="0" max="1" step="0.01"></label>
  <label>Normal strength <input id="nrm" type="range" min="0" max="3" step="0.05"></label>
  <label>Glint <input id="glint" type="range" min="0" max="3" step="0.05"></label>
  <label>Light height <input id="lz" type="range" min="0.1" max="2.5" step="0.05"></label>
  <label>Orbit light <input id="orbit" type="checkbox"></label>
  <label>Wear spots <input id="spots" type="checkbox"></label>
  <small>Drag: move the light. Shift-drag / right-drag: pan. Wheel: zoom. Orange rings: doorway and console (more wear).</small>
</div>
<script>
'use strict';
const SIN = Math.sin(50 * Math.PI / 180), COS = Math.cos(50 * Math.PI / 180);
const Q = new URLSearchParams(location.search);
const S = {
  ppu: +(Q.get('ppu') || 48), cx: +(Q.get('cx') || 8), cy: +(Q.get('cy') || 6),
  lx: +(Q.get('lx') || 6), ly: +(Q.get('ly') || 5), lz: +(Q.get('lz') || 0.6), orbit: Q.get('orbit') !== '0',
  mode: Q.get('mode') || 'new', view: Q.get('view') || 'lit',
  fine: +(Q.get('fine') ?? 1), gouge: +(Q.get('gouge') ?? 0.12), nrm: +(Q.get('nrm') ?? 1), glint: +(Q.get('glint') ?? 1), tape: +(Q.get('tape') ?? 0.22),
  spots: Q.get('spots') !== '0',
};
const SPOTS = [[0.4, 6.0], [11.0, 2.4]];          // doorway (left wall), console (back wall)

const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false });

const VS = `#version 300 es
layout(location = 0) in vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D uB, uN, uM;
uniform vec2 uPage, uView;
uniform vec4 uCam;            // view centre (units), device px per unit, -
uniform vec3 uLight;          // the moving light
uniform vec4 uP;              // fine density, gouge chance, normal strength, glint
uniform int uMode, uView2;    // 0 new, 1 old, 2 split; 0 lit, 1 normals, 2 scratch layer
uniform vec4 uSpots;          // two wear spots (x, y)
uniform float uSpotsOn, uTime, uTape;
out vec4 o;
const float SINE = ${SIN.toFixed(6)}, COSE = ${COS.toFixed(6)};
// atlas rects (beauty px) of the tiles
const vec2 A_WHITE = vec2(1612.0, 4.0), A_WHITE_B = vec2(1412.0, 160.0), A_BLUE_A = vec2(1012.0, 4.0), A_BLUE_B = vec2(1012.0, 160.0),
           A_RED_A = vec2(1212.0, 4.0), A_RED_B = vec2(1212.0, 160.0);
const vec3 TINT_BLUE = vec3(95.0 / 108.0, 106.0 / 114.0, 128.0 / 130.0), TINT_RED = vec3(122.0 / 108.0, 95.0 / 114.0, 98.0 / 130.0);   // zone tint / white zone's

uint hsh(uint x) { x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
uint hsh2(ivec2 c, uint s) { return hsh(uint(c.x) * 1597334677u ^ hsh(uint(c.y) * 3812015801u ^ s)); }
uint st;
float rnd() { st = hsh(st + 0x9e3779b9u); return float(st >> 8) / 16777216.0; }

// --- the scratch accumulator -------------------------------------------------------------------
vec2 gTilt;      // sum of normal tilts (world xy)
float gCov;      // strongest unresolved coverage (for the glint), and its tangent
vec2 gTan;
float gBare, gRim;   // gouges: bare metal in the groove, dark burr rim
vec2 dPx, dPy;   // world units per pixel (screen x, y)

// One groove at signed distance d across (unit vector p), s along of total length L.
// w half width, h depth (units), kind 1 = gouge (albedo too).
void groove(float s, float d, float L, vec2 p, vec2 t, float w, float h, float kind) {
  float pw = abs(dot(p, dPx)) + abs(dot(p, dPy));          // pixel footprint across the groove
  float pl = abs(dot(t, dPx)) + abs(dot(t, dPy));
  if (abs(d) > w + pw || s < -pl || s > L + pl) return;
  float u = clamp(s / L, 0.0, 1.0);
  float tap = sqrt(clamp(4.0 * u * (1.0 - u) * 1.6, 0.0, 1.0));   // tapered ends
  float we = w * max(tap, 0.15), he = h * tap;
  float endA = smoothstep(-pl, pl, s) * smoothstep(-pl, pl, L - s);
  // box-filtered slope of the V profile H(x) = -he * max(0, 1 - |x| / we) over [d - r, d + r]
  float r = max(pw * 0.5, we * 0.2);
  #define HV(x) (-he * max(0.0, 1.0 - abs(x) / we))
  float slope = (HV(d + r) - HV(d - r)) / (2.0 * r);
  gTilt += p * (-slope) * endA;
  // how much of the pixel the groove covers; unresolved grooves glint (resolved ones tilt the normal)
  float cov = clamp((min(d + r, we) - max(d - r, -we)) / (2.0 * r), 0.0, 1.0) * endA;
  float unres = 1.0 - smoothstep(1.0, 4.0, we / pw);
  float g = cov * (0.35 + 0.65 * unres) * (h / (h + 0.0015));
  if (g > gCov) { gCov = g; gTan = t; }
  if (kind > 0.5) {
    gBare = max(gBare, cov * tap);
    float rim = clamp((min(d + r, we * 2.2) - max(d - r, -we * 2.2)) / (2.0 * r), 0.0, 1.0) - cov;
    gRim = max(gRim, rim * tap * endA);
  }
}
void seg(vec2 q, vec2 a, vec2 b, float w, float h, float kind) {
  vec2 ab = b - a; float L = max(length(ab), 1e-4); vec2 t = ab / L, p = vec2(-t.y, t.x);
  vec2 rel = q - a;
  groove(dot(rel, t), dot(rel, p), L, p, t, w, h, kind);
}
void arc(vec2 q, vec2 c, float R, float a0, float span, float w, float h, float kind) {
  vec2 rel = q - c; float rr = length(rel);
  if (abs(rr - R) > w + 0.05) return;
  float th = atan(rel.y, rel.x) - a0; th = mod(th + 3.14159265, 6.2831853) - 3.14159265;
  vec2 p = rel / max(rr, 1e-4), t = vec2(-p.y, p.x);
  groove(th * R, rr - R, span * R, p, t, w, h, kind);
}
vec2 dirv(float a) { return vec2(cos(a), sin(a)); }

// All scratches touching world point P. kind: 0 plain plate cell, 1 tread, 2 grille (none).
void scratches(vec2 P, ivec2 cell, float kind, float wear) {
  vec2 q = P - vec2(cell);                       // 0..1 in the plate cell
  float onPlate = kind < 0.5 ? 1.0 : kind < 1.5 ? 0.35 : 0.0;
  if (onPlate > 0.0) {
    st = hsh2(cell, 17u);
    float dir0 = rnd() * 3.14159265;             // the cell's main traffic direction
    float cellWear = wear * mix(0.35, 1.6, rnd() * rnd());
    // fine hairlines (normal + glint only)
    int nf = int(uP.x * cellWear * (5.0 + 12.0 * rnd()) * onPlate);
    for (int i = 0; i < 32; i++) {
      if (i >= nf) break;
      vec2 c = vec2(0.08) + vec2(rnd(), rnd()) * 0.84;
      float ang = rnd() < 0.65 ? dir0 + (rnd() - 0.5) * 0.7 : rnd() * 3.14159265;
      float L = 0.04 + 0.30 * rnd() * rnd();
      vec2 hd = dirv(ang) * L * 0.5;
      seg(q, clamp(c - hd, 0.05, 0.95), clamp(c + hd, 0.05, 0.95), 0.0025 + 0.003 * rnd(), 0.0008 + 0.0012 * rnd(), 0.0);
    }
    // a cluster of parallel scuffs (a crate's corner dragged)
    if (rnd() < 0.28 * cellWear * onPlate) {
      vec2 c = vec2(0.2) + vec2(rnd(), rnd()) * 0.6;
      float ang = dir0 + (rnd() - 0.5) * 0.5, L = 0.15 + 0.3 * rnd();
      vec2 t = dirv(ang), p = vec2(-t.y, t.x);
      int n = 3 + int(rnd() * 5.0);
      float gap = 0.008 + 0.014 * rnd();
      for (int k = 0; k < 7; k++) {
        if (k >= n) break;
        vec2 o = p * (float(k) * gap + (rnd() - 0.5) * 0.004) + t * (rnd() - 0.5) * 0.05;
        float Lk = L * (0.6 + 0.4 * rnd());
        seg(q, clamp(c + o - t * Lk * 0.5, 0.05, 0.95), clamp(c + o + t * Lk * 0.5, 0.05, 0.95), 0.003 + 0.002 * rnd(), 0.0012 + 0.001 * rnd(), 0.0);
      }
    }
    // a swirl (a chair turning on its casters)
    if (rnd() < 0.14 * cellWear * onPlate) {
      vec2 c = vec2(0.3) + vec2(rnd(), rnd()) * 0.4;
      float R = 0.12 + 0.2 * rnd(), a0 = rnd() * 6.2831853;
      int n = 2 + int(rnd() * 4.0);
      for (int k = 0; k < 5; k++) {
        if (k >= n) break;
        float Rk = R + (rnd() - 0.5) * 0.06;
        arc(q, c, min(Rk, 0.45), a0 + rnd() * 1.5, 0.6 + 1.8 * rnd(), 0.0025 + 0.002 * rnd(), 0.001 + 0.001 * rnd(), 0.0);
      }
    }
    // a deep gouge (something heavy dropped and dragged): bare metal, dark rim
    if (rnd() < uP.y * mix(0.6, 1.4, cellWear / 1.6) * onPlate) {
      // one slightly curved stroke: an arc of a big circle, tapering over its whole length
      vec2 c = vec2(0.25) + vec2(rnd(), rnd()) * 0.5;
      float R = 0.6 + 2.0 * rnd(), a0 = rnd() * 6.2831853, L = 0.1 + 0.3 * rnd();
      float w = 0.004 + 0.005 * rnd(), h = 0.003 + 0.003 * rnd();
      arc(q, c - dirv(a0) * R, R, a0 - 0.5 * L / R, L / R, w, h, 1.0);
    }
  }
  // drags: long lines that cross plate seams; each cell may start one, so look at the neighbours
  for (int k = 0; k < 9; k++) {
    ivec2 nc = cell + ivec2(k % 3 - 1, k / 3 - 1);
    st = hsh2(nc, 91u);
    if (rnd() > 0.10 * wear) continue;
    vec2 a = vec2(nc) + vec2(rnd(), rnd());
    float ang = rnd() * 3.14159265, L = 0.8 + 1.0 * rnd();
    vec2 t = dirv(ang), p = vec2(-t.y, t.x);
    int n = 1 + int(rnd() * 3.0);
    float gap = 0.01 + 0.02 * rnd();
    for (int j = 0; j < 3; j++) {
      if (j >= n) break;
      seg(P, a + p * float(j) * gap, a + p * float(j) * gap + t * L * (0.7 + 0.3 * rnd()), 0.003 + 0.002 * rnd(), 0.001 + 0.0012 * rnd(), 0.0);
    }
  }
}

// --- tape -------------------------------------------------------------------------------------
// Per 2 x 2 tile (hash): most none; else one of: a strip across a seam, a strip along a seam, an X,
// a corner patch (L), overlapping strips. Silver duct tape mostly, sometimes hazard or black gaffer.
// Each strip: torn ends (zigzag), wavy edges, dirt along the edges and in blotches, maybe a peeled
// corner (the floor shows with adhesive grime, a bright rolled lip). Raised: edge normals, weave.
float gTape;          // coverage
vec3 gTapeCol;        // albedo
vec2 gTapeTilt;
float gTapeSpec;      // extra shine (duct tape)
float vnoise(vec2 x) {
  vec2 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  uint s = 7u;
  float a = float(hsh2(ivec2(i), s) >> 8) / 16777216.0, b = float(hsh2(ivec2(i) + ivec2(1, 0), s) >> 8) / 16777216.0;
  float c = float(hsh2(ivec2(i) + ivec2(0, 1), s) >> 8) / 16777216.0, d = float(hsh2(ivec2(i) + ivec2(1, 1), s) >> 8) / 16777216.0;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 x) { return 0.55 * vnoise(x) + 0.3 * vnoise(mat2(0.8, -0.6, 0.6, 0.8) * x * 2.1 + 3.7) + 0.15 * vnoise(mat2(0.8, 0.6, -0.6, 0.8) * x * 4.3 + 9.1); }
void strip(vec2 P, vec2 c, float ang, float hl, float hw, int col, float age, float peel, float sd) {
  vec2 t = dirv(ang), p = vec2(-t.y, t.x), rel = P - c;
  float s = dot(rel, t), d = dot(rel, p);
  if (abs(s) > hl + 0.05 || abs(d) > hw + 0.05) return;
  float pw = abs(dot(p, dPx)) + abs(dot(p, dPy)), pl = abs(dot(t, dPx)) + abs(dot(t, dPy));
  float rw = max(pw * 0.5, 0.0015), rl = max(pl * 0.5, 0.0015);
  // wavy edges, torn zigzag ends (each end its own tear)
  float hwE = hw * (1.0 + 0.05 * (vnoise(vec2(s * 22.0, sd)) - 0.5));
  float tear = 0.012 * abs(fract(d * 38.0 + sd * 3.0) - 0.5) * 2.0 + 0.006 * vnoise(vec2(d * 90.0, sd + 5.0));
  float hlE = hl - tear;
  float cw = clamp((hwE - abs(d)) / (2.0 * rw) + 0.5, 0.0, 1.0), cl = clamp((hlE - abs(s)) / (2.0 * rl) + 0.5, 0.0, 1.0);
  float a = cw * cl;
  // peeled corner: a triangle at one end lifted off (curling up)
  float pk = peel * hw * 1.6;
  float cut = 0.0, lip = 0.0;
  if (pk > 0.0) {
    float e = (s * sign(sd - 0.5 + 1e-3) - hl) + (hw - d);      // > -pk inside the peeled triangle
    float rr = max(rl, rw);
    cut = clamp((e + pk) / (2.0 * rr) + 0.5, 0.0, 1.0) * cl * cw;
    lip = exp(-pow((e + pk) / max(0.006, rr * 2.0), 2.0)) * cw * cl;
    a *= 1.0 - cut;
  }
  if (a <= 0.0 && lip <= 0.0 && cut <= 0.0) return;
  vec3 tc = col == 0 ? vec3(0.5, 0.51, 0.53) * mix(vec3(1.0), vec3(1.05, 1.0, 0.88), age) : col == 1 ? vec3(0.7, 0.56, 0.16) : vec3(0.2, 0.2, 0.21);
  if (col == 1 && fract((s + d) * 9.0) < 0.5) tc = vec3(0.12, 0.11, 0.1);      // hazard stripes
  // dirt: along the edges, in blotches, more with age; scuffed bright where boots wore the top
  float edge = min(hwE - abs(d), hlE - abs(s));
  float dirt = (0.25 + 0.5 * age) * exp(-max(edge, 0.0) / 0.014) + age * 0.35 * smoothstep(0.4, 0.75, fbm(rel * 22.0 + sd * 13.0));
  tc *= 1.0 - 0.6 * clamp(dirt, 0.0, 1.0);
  tc = mix(tc, tc * 1.12 + 0.03, age * 0.5 * smoothstep(0.5, 0.8, fbm(vec2(s * 9.0, d * 14.0) + sd * 7.0)));
  // the floor under the peeled corner: adhesive grime (darkens what's below; folded into gTapeCol)
  float under = cut * 0.6;
  // normals: the tape's edge is a step up (box-filtered), plus a faint weave close up
  float th = 0.012;
  float gw = (abs(abs(d) - hwE) < rw ? -sign(d) / (2.0 * rw) : 0.0) * cl;
  float glE = (abs(abs(s) - hlE) < rl ? -sign(s) / (2.0 * rl) : 0.0) * cw;
  vec2 tilt = -(p * gw + t * glE) * th * (1.0 - cut);
  float wv = 1.0 - smoothstep(0.002, 0.006, max(pw, pl));
  tilt += (p * sin(d * 1400.0) + t * sin(s * 1100.0)) * 0.05 * wv * a;
  // duct tape crinkles: creases mostly across the strip (fade out when they get smaller than a pixel)
  float wr = 1.0 - smoothstep(0.004, 0.012, max(pw, pl));
  float n1 = fbm(vec2(s * 30.0, d * 6.0) + sd * 31.0), n2 = fbm(vec2(s * 30.0 + 0.2, d * 6.0) + sd * 31.0);
  tilt += t * (n2 - n1) * 0.8 * wr * a;
  vec2 pd = normalize(t * sign(sd - 0.5 + 1e-3) - p);                  // the lip faces away from the tape
  tilt += pd * lip * 0.6;
  // composite over what's there (later strips on top)
  gTapeCol = mix(gTapeCol * (1.0 - under), tc, a) + vec3(lip * 0.35);
  gTapeTilt = mix(gTapeTilt, vec2(0.0), a) + tilt;
  gTapeSpec = mix(gTapeSpec, col == 0 ? 0.55 : col == 2 ? 0.25 : 0.3, a);
  gTape = max(gTape, max(a, under * 0.7));
}
// the kind of plate cell sub (0..1, 0..1) of a tile: 0 plain, 1 tread, 2 grille (layouts a / b in floors.py;
// in the game: a per-instance 4-cell kind mask)
float cellKind(ivec2 tile, ivec2 sub) {
  bool a = (hsh2(tile, 5u) & 1023u) < 480u;
  return a ? ((sub.x == 1 && sub.y == 0) ? 1.0 : 0.0) : (sub.y == 0 ? 0.0 : sub.x == 0 ? 1.0 : 2.0);
}
void tapes(vec2 P, ivec2 tile0, float chance) {
  for (int k = 0; k < 9; k++) {
    ivec2 tl = tile0 + ivec2(k % 3 - 1, k / 3 - 1);
    st = hsh2(tl, 333u);
    if (rnd() > chance) continue;
    vec2 o = vec2(tl) * 2.0;                       // the tile's corner (units)
    int type = int(rnd() * 5.0);
    int col = rnd() < 0.8 ? 0 : rnd() < 0.6 ? 1 : 2;
    float age = rnd(), hw = (col == 1 ? 0.04 : 0.045) + 0.02 * rnd(), sd = rnd();
    // a seam point on the 1-unit grid inside the tile
    vec2 sp = o + vec2(float(int(rnd() * 2.0)), float(int(rnd() * 2.0)));
    bool vert = rnd() < 0.5;                       // which seam line
    float base = vert ? 1.5707963 : 0.0;
    if (type == 0) {           // across a seam
      vec2 c = sp + (vert ? vec2(0.0, 0.15 + 0.7 * rnd()) : vec2(0.15 + 0.7 * rnd(), 0.0));
      strip(P, c, base + 1.5707963 + (rnd() - 0.5) * 0.45, 0.14 + 0.25 * rnd(), hw, col, age, rnd() < 0.45 ? 0.5 + 0.5 * rnd() : 0.0, sd);
    } else if (type == 1) {    // along a seam, over a long crack
      vec2 c = sp + (vert ? vec2(0.0, 0.5) : vec2(0.5, 0.0)) + (vert ? vec2(0.0, (rnd() - 0.5) * 0.4) : vec2((rnd() - 0.5) * 0.4, 0.0));
      strip(P, c, base + (rnd() - 0.5) * 0.08, 0.25 + 0.45 * rnd(), hw, col, age, rnd() < 0.35 ? 0.4 + 0.5 * rnd() : 0.0, sd);
    } else if (type == 2) {    // an X over a crack in a plate
      ivec2 sb = ivec2(rnd() * 2.0, rnd() * 2.0);
      if (cellKind(tl, sb) > 1.5) sb.y = 0;        // not over the vent
      vec2 c = o + vec2(sb) + vec2(0.3 + 0.4 * rnd(), 0.3 + 0.4 * rnd());
      float a0 = rnd() * 3.14159265, L = 0.12 + 0.12 * rnd();
      strip(P, c, a0, L, hw, col, age, 0.0, sd);
